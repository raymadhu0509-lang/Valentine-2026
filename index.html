<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine 💘</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: 'Comic Sans MS', cursive, sans-serif;
      overflow: hidden;
    }

    .container {
      text-align: center;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      max-width: 90%;
    }

    h1 {
      color: #ff4d6d;
      font-size: 28px;
      margin-bottom: 20px;
    }

    button {
      font-size: 18px;
      padding: 10px 25px;
      margin: 10px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
    }

    #yesBtn {
      background-color: #ff4d6d;
      color: white;
    }

    #noBtn {
      background-color: #ccc;
    }

    .cute {
      font-size: 60px;
      margin-top: 20px;
      display: none;
    }

    .message {
      color: #ff4d6d;
      font-size: 18px;
      margin-top: 10px;
      display: none;
    }

    .heart {
      position: absolute;
      color: red;
      font-size: 20px;
      animation: floatUp 3s linear forwards;
    }

    @keyframes floatUp {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-100vh); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Garima, will you be my Valentine? 💕</h1>

    <button id="yesBtn">Yes 💖</button>
    <button id="noBtn">No 🙃</button>

    <div id="cute" class="cute">🥺</div>
    <div id="msg" class="message">Please pookie… please baby 🥹💗</div>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const cute = document.getElementById("cute");
    const msg = document.getElementById("msg");

    const cuteEmojis = ["🥺", "😭", "🐻", "💔", "😿", "👉👈"];

    noBtn.addEventListener("click", () => {
      cute.style.display = "block";
      msg.style.display = "block";
      cute.textContent =
        cuteEmojis[Math.floor(Math.random() * cuteEmojis.length)];
    });

    yesBtn.addEventListener("click", () => {
      for (let i = 0; i < 40; i++) {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.textContent = "💖";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.bottom = "0px";
        heart.style.fontSize = Math.random() * 20 + 15 + "px";
        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 3000);
      }
    });
  </script>

</body>
</html>
